name: Terraform CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: read

env:
  TF_VERSION: "1.9.8"
  WORKING_DIRECTORY: "./terraform"

jobs:

  terraform-plan:

    name: Terraform Plan

    runs-on:
      - self-hosted

    steps:

      # ---------------------------------------------------
      # 1. Checkout source code
      # ---------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ---------------------------------------------------
      # 2. Azure Login using OIDC
      # ---------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ---------------------------------------------------
      # 3. Verify Azure authentication
      # ---------------------------------------------------

      - name: Verify Azure Account
        shell: bash
        run: |
          az account show


      # ---------------------------------------------------
      # 4. Check Terraform
      # ---------------------------------------------------

      - name: Check Terraform Version
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          terraform version


      # ---------------------------------------------------
      # 5. Terraform Format Check
      # ---------------------------------------------------

      - name: Terraform Format Check
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          terraform fmt -check -recursive


      # ---------------------------------------------------
      # 6. Terraform Init
      # ---------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          terraform init


      # ---------------------------------------------------
      # 7. Terraform Validate
      # ---------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          terraform validate


      # ---------------------------------------------------
      # 8. Terraform Plan
      # ---------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          terraform plan \
            -out=tfplan


      # ---------------------------------------------------
      # 9. Upload Terraform Plan
      # ---------------------------------------------------

      - name: Upload Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.WORKING_DIRECTORY }}/tfplan


  # =======================================================
  # TERRAFORM APPLY
  # =======================================================

  terraform-apply:

    name: Terraform Apply

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - terraform-plan

    runs-on:
      - self-hosted
      - linux
      - terraform

    environment:
      name: production

    steps:

      # ---------------------------------------------------
      # 1. Checkout source
      # ---------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ---------------------------------------------------
      # 2. Azure Login using OIDC
      # ---------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ---------------------------------------------------
      # 3. Verify Azure
      # ---------------------------------------------------

      - name: Verify Azure Account
        run: |
          az account show


      # ---------------------------------------------------
      # 4. Terraform Init
      # ---------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          terraform init


      # ---------------------------------------------------
      # 5. Terraform Apply
      # ---------------------------------------------------

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          terraform apply \
            -auto-approve